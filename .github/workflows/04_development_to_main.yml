name: Development → Main

on:
  push:
    branches:
      - development
  workflow_dispatch: {}

concurrency:
  group: deploy-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 01-03 no longer commit their output onto a branch's git tree; they
  # publish to the shared `pipeline-data-latest` release instead (see those
  # workflows' comments). This is the single place the geodata merge runs:
  # 02 and 03 each publish their intermediate parquet and trigger this
  # workflow, which takes the latest of both from that release, joins them
  # with scripts/merge_geo.py, validates the result, and only then keeps
  # `development`'s one tracked parquet (the file app.py reads at import
  # time, with no fallback) in sync and re-publishes it under a separate,
  # stable `dataset-latest` release, which is what external users and main's
  # README should point at. Runs are idempotent, and a run started by a later
  # trigger cancels an earlier one, so the last run always sees both inputs.
  PIPELINE_RELEASE_TAG: pipeline-data-latest
  DATASET_RELEASE_TAG: dataset-latest


# ============ Merge, validate and publish ============ #
# App files (app.py, _brand.yml, pyproject.toml, uv.lock, .python-version)
# are intentionally NOT touched here while the app is under active
# development on `development`. README.md is also excluded. Only the one
# dataset parquet app.py reads is kept in sync.

jobs:
  update-development:
    runs-on: ubuntu-latest
    env:
      DEVELOPMENT_BRANCH: ${{ github.event.inputs.development_branch || vars.DEVELOPMENT_BRANCH || 'development' }}

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEVELOPMENT_BRANCH }}
          path: development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "development/uv.lock"

      # The locked polars keeps the written parquet byte-identical from run
      # to run; an unpinned newer polars serialises the same data to
      # different bytes, which would commit a new copy on every polars release.
      - name: Install dependencies
        run: uv sync --frozen --project development

      - name: Download the intermediates from the pipeline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p development/data
          gh release download "${PIPELINE_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'daioe_scb_years_all_levels.parquet' \
            -p 'county_coordinates.parquet' \
            -D development/data --clobber

      - name: Merge geodata into the daioe dataset
        run: |
          set -euo pipefail
          cd development
          uv run python scripts/merge_geo.py

      - name: Download previous dataset release for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download "${DATASET_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'daioe_scb_years_all_levels_geo.parquet' -D previous --clobber || \
            echo "No previous dataset release yet; skipping the comparison checks."

      # Gate: a failure here stops the job before anything is committed to
      # development or published to either release.
      - name: Validate dataset before publishing
        run: |
          set -euo pipefail
          previous_args=()
          if [ -f previous/daioe_scb_years_all_levels_geo.parquet ]; then
            previous_args=(--previous ../previous/daioe_scb_years_all_levels_geo.parquet)
          fi
          cd development
          uv run python scripts/validate.py \
            data/daioe_scb_years_all_levels_geo.parquet "${previous_args[@]}"

      - name: Commit onto development if changed
        run: |
          set -euo pipefail
          cd development
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daioe_scb_years_all_levels_geo.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update daioe_scb_years_all_levels_geo.parquet [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${DEVELOPMENT_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${DEVELOPMENT_BRANCH} and retrying..."
            git fetch origin "${DEVELOPMENT_BRANCH}"
            git rebase "origin/${DEVELOPMENT_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${DEVELOPMENT_BRANCH} after 5 attempts."
          exit 1

      - name: Publish to the pipeline and dataset releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${PIPELINE_RELEASE_TAG}" \
            development/data/daioe_scb_years_all_levels_geo.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${DATASET_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${DATASET_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "AI-SCB Year and Regions - dataset (latest)" \
              --notes "The published, citable dataset (data/LICENSE: CC BY 4.0). Superseded on every successful pipeline run; see main's README for schema and provenance."
          gh release upload "${DATASET_RELEASE_TAG}" \
            development/data/daioe_scb_years_all_levels_geo.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber




# ============ Keep development's workflow copy in sync ============ #
# This workflow lives only on `main`; `on: push: development` needs a copy
# of this file checked in on development itself to fire, because GitHub
# resolves push-event triggers from the pushed ref's own tree, not the
# default branch. Re-publish main's copy onto development after every run
# so a manual edit here never drifts out of sync with what actually runs.

  sync-workflow-copy:
    runs-on: ubuntu-latest
    needs: update-development
    env:
      DEVELOPMENT_BRANCH: ${{ github.event.inputs.development_branch || vars.DEVELOPMENT_BRANCH || 'development' }}

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEVELOPMENT_BRANCH }}

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Sync workflow file from main
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          git show origin/main:.github/workflows/04_development_to_main.yml \
            > .github/workflows/04_development_to_main.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/04_development_to_main.yml
          if git diff --cached --quiet; then
            echo "Workflow copy already in sync."
            exit 0
          fi
          git commit -m "chore: sync 04 workflow copy from main [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${DEVELOPMENT_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${DEVELOPMENT_BRANCH} and retrying..."
            git fetch origin "${DEVELOPMENT_BRANCH}"
            git rebase "origin/${DEVELOPMENT_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${DEVELOPMENT_BRANCH} after 5 attempts."
          exit 1
