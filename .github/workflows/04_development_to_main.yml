name: Development → Main

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to promote deploy files from"
        required: false
        default: "development"
      target_branch:
        description: "Target branch to push deploy files into"
        required: false
        default: "main"
  schedule:
    - cron: "30 0 * * *"  # daily at 00:30 UTC (after the daioe/geo pulls land)

concurrency:
  group: deploy-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# ============ Promote dataset ============ #
# App files (app.py, _brand.yml, pyproject.toml, uv.lock, .python-version)
# are intentionally NOT promoted while the app is under active development
# on `development`. README.md is also excluded: `main`'s README is
# maintained independently (data-only) while `development`'s documents the
# full pipeline and in-progress app. Only the dataset parquet is synced.

jobs:
  sync-deploy-files:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'development' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || vars.TARGET_BRANCH || 'main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}
          path: source

      - name: Validate deploy files
        run: |
          set -euo pipefail
          cd source
          required_files=(
            "data/daioe_scb_years_all_levels_geo.parquet"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required deploy file: $file"
              exit 1
            fi
          done

      - name: Create deploy bundle
        run: |
          set -euo pipefail
          cd source
          files=(
            "data/daioe_scb_years_all_levels_geo.parquet"
          )

          tar -czf ../deploy-files.tgz "${files[@]}"

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Apply deploy bundle
        run: |
          set -euo pipefail
          tar -xzf deploy-files.tgz -C target

      - name: Commit and push
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/daioe_scb_years_all_levels_geo.parquet

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: promote dataset [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${TARGET_BRANCH} and retrying..."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${TARGET_BRANCH} after 5 attempts."
          exit 1
