name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  schedule:
    - cron: "50 0 * * *"  # daily at 00:50 UTC

  workflow_dispatch: {}

# The Space builds from main. Pushes made by the other workflows do not trigger
# this one (they use the workflow token), so 04 and 05 dispatch it explicitly.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ai-econ-lab/daioe-explorer-regions
          hf_token: ${{ secrets.HF_TOKEN }}
