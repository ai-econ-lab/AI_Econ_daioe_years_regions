name: Geo Pull → Development

on:
  push:
    branches:
      - geo_pull
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to run scripts from"
        required: false
        default: "geo_pull"
      target_branch:
        description: "Target branch to push data into"
        required: false
        default: "development"
  schedule:
    - cron: "15 0 * * *"  # daily at 00:15 UTC (offset from the scb/daioe pulls)

concurrency:
  group: data-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# ============ Build ============ #

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'geo_pull' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run data scripts
        run: |
          set -euo pipefail
          uv run python main.py

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: county_coordinates_output
          path: data/county_coordinates.parquet


# ============ Sync ============ #

  sync-target:
    runs-on: ubuntu-latest
    needs: build-data
    # Shared with 02_daioe_pull_to_development.yml's sync-target job: both
    # workflows write to the same `development` branch independently, so
    # this queues them instead of racing two concurrent pushes.
    concurrency:
      group: development-data-write
      cancel-in-progress: false
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || vars.TARGET_BRANCH || 'development' }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: county_coordinates_output
          path: data/

      - name: Validate artifact
        run: |
          set -euo pipefail
          if [ ! -f "data/county_coordinates.parquet" ]; then
            echo "ERROR: Missing expected parquet file in artifact."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Merge geodata into the daioe dataset
        run: |
          set -euo pipefail
          uv run python scripts/merge_geo.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/county_coordinates.parquet data/daioe_scb_years_all_levels_geo.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update county_coordinates.parquet [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${TARGET_BRANCH} and retrying..."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${TARGET_BRANCH} after 5 attempts."
          exit 1
