name: DAIOE Pull → Development

on:
  push:
    branches:
      - daioe_pull
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to run scripts from"
        required: false
        default: "daioe_pull"
      scripts_branch:
        description: "Branch that holds scripts/merge_geo.py"
        required: false
        default: "development"
  schedule:
    - cron: "0 0 * * *"  # daily at 00:00 UTC

concurrency:
  group: data-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write  # needed to trigger 04 via `gh workflow run` below

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single repo-wide release holding every stage's parquet output, replacing
  # per-branch git commits that were growing this repo by ~33 MB/day. Every
  # stage across 01-04 uploads its output here instead of committing it onto
  # the target branch; consumers `gh release download` their inputs from here
  # rather than relying on the target branch's git tree already having them.
  RELEASE_TAG: pipeline-data-latest


# ============ Build ============ #

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'daioe_pull' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download input data from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/processed
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'ssyk12_aggregated_ssyk4_to_ssyk1.parquet' \
            -p 'ssyk12_national_age_aggregated_ssyk4_to_ssyk1.parquet' \
            -D data/processed --clobber

      - name: Run data scripts
        run: |
          set -euo pipefail
          uv run python main.py
          uv run python main_national_age.py

      - name: Publish national-age exposure to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "Pipeline data (latest)" \
              --notes "Auto-updated by the data pipeline; each asset is superseded on every run. Not a versioned release - see README for provenance and schema, and the dataset-latest release for the citable published dataset."
          gh release upload "${RELEASE_TAG}" data/daioe_scb_national_age.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: daioe_scb_merge_output
          path: data/daioe_scb_years_all_levels.parquet


# ============ Merge & publish ============ #

  merge-and-publish:
    runs-on: ubuntu-latest
    needs: build-data
    env:
      SCRIPTS_BRANCH: ${{ github.event.inputs.scripts_branch || vars.SCRIPTS_BRANCH || 'development' }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SCRIPTS_BRANCH }}

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: daioe_scb_merge_output
          path: data/

      - name: Validate artifact
        run: |
          set -euo pipefail
          if [ ! -f "data/daioe_scb_years_all_levels.parquet" ]; then
            echo "ERROR: Missing expected parquet file in artifact."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download county coordinates from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'county_coordinates.parquet' -D data --clobber || \
            echo "No county_coordinates.parquet published yet; merge_geo.py will pass the daioe data through unmerged."

      - name: Merge geodata into the daioe dataset
        run: |
          set -euo pipefail
          uv run python scripts/merge_geo.py

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "Pipeline data (latest)" \
              --notes "Auto-updated by the data pipeline; each asset is superseded on every run. Not a versioned release - see README for provenance and schema, and the dataset-latest release for the citable published dataset."
          gh release upload "${RELEASE_TAG}" \
            data/daioe_scb_years_all_levels.parquet data/daioe_scb_years_all_levels_geo.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Trigger next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 04_development_to_main.yml --repo "${GITHUB_REPOSITORY}" --ref main


# ============ Keep daioe_pull's workflow copy in sync ============ #
# This workflow lives only on `main`; `on: push: daioe_pull` needs a copy
# of this file checked in on daioe_pull itself to fire, because GitHub
# resolves push-event triggers from the pushed ref's own tree, not the
# default branch. Re-publish main's copy onto daioe_pull after every run so
# a manual edit here never drifts out of sync with what actually runs, and
# so a plain push to daioe_pull keeps triggering this workflow immediately
# instead of only running on the daily schedule.

  sync-workflow-copy:
    runs-on: ubuntu-latest
    needs: merge-and-publish
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'daioe_pull' }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Sync workflow file from main
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          git show origin/main:.github/workflows/02_daioe_pull_to_development.yml \
            > .github/workflows/02_daioe_pull_to_development.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/02_daioe_pull_to_development.yml
          if git diff --cached --quiet; then
            echo "Workflow copy already in sync."
            exit 0
          fi
          git commit -m "chore: sync 02 workflow copy from main [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${SOURCE_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${SOURCE_BRANCH} and retrying..."
            git fetch origin "${SOURCE_BRANCH}"
            git rebase "origin/${SOURCE_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${SOURCE_BRANCH} after 5 attempts."
          exit 1
