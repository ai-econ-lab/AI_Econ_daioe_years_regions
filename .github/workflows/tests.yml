name: Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # Full history so the workflow copy test can read origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check app.py src tests

      - name: Format
        run: uv run --frozen ruff format --check app.py src tests

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest
